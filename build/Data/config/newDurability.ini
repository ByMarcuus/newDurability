[EXTRAS]
# Disables weapon and armor durability mechanics.
# Allowed values: 0 or 1.
# Default value: 0.
bDisableDurability=0

[WEAPONS]
# Base durability loss per shot.
# Allowed values: 0 to 3.
# Default value: 0.2.
# Repr: (item-health - fWeaponBaseHealth).
fWeaponBaseHealth=0.2

# Additional durability loss, reduced by Skill Points.
# Allowed values: 0 to 3.
# Default value: 0.5.
# Repr: (item-health - ((100 - SkillPoints) / 100) * fWeaponSkillMult).
fWeaponSkillMult=0.5

[ARMORS]
# Base durability loss per hit.
# Allowed values: 0 to 3.
# Default value: 0.2.
# Repr: (item-health - fArmorBaseHealth).
fArmorBaseHealth=0.2

# Additional durability loss, reduced by Special Points.
# Allowed values: 0 to 3.
# Default value: 0.5.
# Repr: (item-health - ((10 - SpecialPoints) / 10) * fArmorSkillMult).
fArmorSkillMult=0.5

#[TIPS]
# - Lower values (on both f*Base and f*SkillMult) increases durability.
# - Variable prefixes indicate data types:
#   - b = Boolean (true/false)
#   - f = Float (decimal number)
#   - i = Integer (whole number)
#   - s = String (New Vegas only)
